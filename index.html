<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Birthday Gift</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800&family=Great+Vibes&family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
:root{--peach:#ffe9dc;--peach-glow:#ff9aa8;--red:#e8123f;--gold:#e9b949;--ink:#5a2a2a;
 --bg:#f4efec;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0a}}
:root[data-theme="dark"]{--bg:#0b0b0a}
html,body{height:100%;margin:0;background:var(--bg)}
body{display:flex;align-items:center;justify-content:center;font-family:'Inter',system-ui,sans-serif}
#stage{position:relative;height:min(96vh,860px);aspect-ratio:9/16;max-width:100vw;overflow:hidden;border-radius:14px;
 background:radial-gradient(circle at 50% 35%,#fff6ee,var(--peach) 70%);cursor:pointer}
.scene{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .6s}
.scene.on{opacity:1}
.cap{position:absolute;width:100%;text-align:center;color:var(--ink);letter-spacing:.12em;font-size:clamp(9px,1.5vh,13px);text-transform:lowercase}

/* scene 1: heart */
.glow{position:absolute;left:50%;top:38%;width:70%;aspect-ratio:1;transform:translate(-50%,-50%);
 background:radial-gradient(ellipse 60% 55% at 50% 50%,var(--peach-glow) 0%,transparent 70%);animation:beat 2.6s ease-in-out infinite;filter:blur(8px)}
.heart{position:absolute;left:50%;top:38%;width:22%;aspect-ratio:1;margin:-11% 0 0 -11%;animation:beat 2.6s ease-in-out infinite;transform-origin:50% 55%}
.heart svg{width:100%;height:100%;filter:drop-shadow(0 8px 18px rgba(232,18,63,.45))}
.heart.burst{animation:pop .7s ease-in forwards}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.14)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
@keyframes pop{to{transform:scale(3);opacity:0}}
.spark{position:absolute;left:50%;top:38%;width:8px;height:8px;border-radius:50%;background:var(--peach-glow);opacity:0}

/* scene 2: red wish */
#s2{background:var(--red)}
#s2 .band{position:absolute;inset:30% 0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;
 font-family:'Playfair Display',Georgia,serif;font-weight:800;line-height:.95;font-size:clamp(46px,9vh,92px);text-align:center}
#s2 .w{display:block;overflow:hidden;height:1.05em}
#s2 .w span{display:block;transform:translateY(110%);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
#s2.on .w span{transform:none}
#s2 .w:nth-child(2) span{transition-delay:.25s}
#s2 .cap{top:-8%;color:#ffd3dc}
.line{width:0;height:3px;background:var(--gold);margin-top:16px;transition:width 1s .9s;border-radius:3px}
#s2.on .line{width:30%}

/* scene 3: tree */
#s3 svg{position:absolute;inset:0;width:100%;height:100%}
.branch{fill:none;stroke:#4a2a24;stroke-linecap:round;stroke-dasharray:var(--l);stroke-dashoffset:var(--l)}
#s3.on .branch{animation:draw 1.6s ease-out forwards;animation-delay:var(--d)}
@keyframes draw{to{stroke-dashoffset:0}}
.lv{transform-box:fill-box;transform-origin:center;transform:scale(0);opacity:0}
.lv.show{animation:bloom .7s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes bloom{to{transform:scale(1);opacity:1}}
.petal{position:absolute;width:10px;height:10px;opacity:0;animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:.8}100%{transform:translate(-60px,110vh) rotate(360deg);opacity:0}}
#wish{position:absolute;left:4%;bottom:12%;opacity:0;transition:opacity 1.2s;color:#b0243f;font-family:'Great Vibes','Brush Script MT',cursive;font-size:clamp(34px,6.5vh,62px)}
#wish small{display:block;font-family:'Inter',sans-serif;font-size:clamp(8px,1.3vh,12px);letter-spacing:.1em;color:var(--ink)}
#wish.on{opacity:1}
#s3 .cap{left:4%;width:auto;bottom:21%;text-align:left;opacity:0;transition:opacity 1s}
#s3 .cap.on{opacity:1}
#fade{position:absolute;inset:0;background:#000;opacity:0;transition:opacity 1.2s;pointer-events:none}
#replay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 22px;border:0;border-radius:30px;background:var(--red);color:#fff;font:inherit;font-size:15px;opacity:0;pointer-events:none;transition:opacity .6s;cursor:pointer}
#replay.on{opacity:1;pointer-events:auto}
</style>
</head>
<body>
<div id="stage">
  <section class="scene on" id="s1">
    <div class="cap" style="top:9%">a little something, for you</div>
    <div class="glow"></div>
    <div class="heart" id="heart"><svg viewBox="0 0 32 29"><path fill="#e8123f" d="M16 28C-6 12 5-2 16 7 27-2 38 12 16 28z"/><path fill="#fff" opacity=".35" d="M8 8c2-3 5-2 6 0-2-1-4 0-6 0z"/></svg></div>
    <div class="cap" style="bottom:7%">tap to unwrap</div>
  </section>
  <section class="scene" id="s2">
    <div class="band"><div class="cap">make a wish…</div>
      <span class="w"><span>Happy</span></span><span class="w"><span>Birthday</span></span><div class="line"></div></div>
  </section>
  <section class="scene" id="s3">
    <svg viewBox="0 0 400 711" preserveAspectRatio="xMidYMid slice" id="tree"></svg>
    <div class="cap" id="cap">and… make it count</div>
    <div id="wish">Happy Birthday<small>here’s to your best year yet</small></div>
  </section>
  <div id="fade"></div>
  <button id="replay">Replay ↻</button>
</div>

<script>
const $=id=>document.getElementById(id), st=$('stage');
const scenes=[$('s1'),$('s2'),$('s3')];
let timers=[], started=false;
const at=(ms,fn)=>timers.push(setTimeout(fn,ms));
const show=i=>scenes.forEach((s,j)=>s.classList.toggle('on',j===i));

// Build the tree once: trunk, branches, heart-shaped canopy of small hearts
const NS='http://www.w3.org/2000/svg', tree=$('tree');
const mk=(t,a,p=tree)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
const paths=[
 ['M200 690 C200 600 196 520 200 430',16,0],
 ['M199 520 C170 480 140 450 105 400',7,.9],['M200 480 C230 440 262 410 300 360',7,1],
 ['M200 440 C195 390 190 340 175 280',6,1.1],['M200 430 C215 380 225 320 235 270',6,1.2],
 ['M140 450 C120 420 90 400 70 360',4,1.5],['M262 410 C290 390 320 370 340 330',4,1.6]];
paths.forEach(([d,w,del])=>{const p=mk('path',{d,class:'branch','stroke-width':w});
  const L=Math.ceil(p.getTotalLength());p.style.setProperty('--l',L);p.style.setProperty('--d',del+'s')});
const cols=['#ff7a8a','#ff9aa8','#ffb36b','#f5586f','#ffc98a','#ee4a68'], leaves=[];
for(let i=0;i<420;i++){
  const t=Math.random()*Math.PI*2, r=Math.sqrt(Math.random());
  const x=200+16*Math.pow(Math.sin(t),3)*9.3*r;
  const y=215-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*9.3*r;
  const s=.28+Math.random()*.35;
  const g=mk('g',{transform:`translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(Math.random()*60-30)|0}) scale(${s})`});
  const h=mk('path',{d:'M0 10C-22-6-12-22 0-12 12-22 22-6 0 10z',fill:cols[i%cols.length],class:'lv'},g);
  leaves.push([h,y]);
}
leaves.sort((a,b)=>b[1]-a[1]); // bloom from the bottom of the canopy upward

function petals(){
  for(let i=0;i<14;i++){const p=document.createElement('div');p.className='petal';
    p.style.cssText=`left:${Math.random()*100}%;top:-5%;background:${cols[i%6]};border-radius:50% 0;animation-duration:${6+Math.random()*6}s;animation-delay:${Math.random()*6}s`;
    $('s3').appendChild(p)}
}

function burst(){
  $('heart').classList.add('burst');
  for(let i=0;i<24;i++){const s=document.createElement('div');s.className='spark';$('s1').appendChild(s);
    const a=i/24*Math.PI*2, d=90+Math.random()*120;
    s.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(0)`,opacity:0}],{duration:900,easing:'ease-out',delay:350,fill:'both'});}
}

function play(){
  timers.forEach(clearTimeout);timers=[];started=true;
  $('replay').classList.remove('on');$('fade').style.opacity=0;
  $('heart').classList.remove('burst');document.querySelectorAll('.spark,.petal').forEach(e=>e.remove());
  leaves.forEach(([h])=>h.classList.remove('show'));
  $('wish').classList.remove('on');$('cap').classList.remove('on');
  scenes.forEach(s=>s.classList.remove('on'));
  // restart CSS animations of scene 2 / 3
  void st.offsetWidth; show(0);
  at(3800,burst);
  at(4900,()=>show(1));
  at(9200,()=>{show(2);petals()});
  at(14000,()=>leaves.forEach(([h],i)=>setTimeout(()=>h.classList.add('show'),i*7)));
  at(16500,()=>{$('cap').classList.add('on');$('wish').classList.add('on')});
  at(22500,()=>$('fade').style.opacity=.75);
  at(23500,()=>$('replay').classList.add('on'));
}
st.addEventListener('click',e=>{ if(e.target.id==='replay'||!started){play()} else if(timers.length&&$('s1').classList.contains('on')){timers.forEach(clearTimeout);timers=[];burst();at(500,()=>show(1));at(4700,()=>{show(2);petals()});at(9500,()=>leaves.forEach(([h],i)=>setTimeout(()=>h.classList.add('show'),i*7)));at(12000,()=>{$('cap').classList.add('on');$('wish').classList.add('on')});at(18000,()=>$('replay').classList.add('on'))}});
play();
</script>
</body>
</html>
